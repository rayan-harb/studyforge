[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studyforge"
version = "1.0.0"
description = "A terminal study manager combining session analytics, flashcards, quizzes, and focused recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rayan Harb" }]
keywords = ["study", "flashcards", "analytics", "cli", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
studyforge = "studyforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studyforge"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

